<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OldSkool — Fitness Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b0c0e;--panel:#15171a;--panel2:#1d2024;--line:#34383e;--text:#f5f5f2;--muted:#92969d;--yellow:#f4d400;--red:#f12638;--green:#52d62f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#f4d40012,transparent 28%),var(--bg);color:var(--text);font:14px Figtree,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#111316ee;border-right:1px solid #fff1;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{padding:4px 12px 22px}.brand b{font:800 31px Georgia;color:var(--yellow)}.brand small{display:block;color:var(--red);font-weight:900;letter-spacing:2px;margin-top:3px}.nav-title{color:#777c82;font-size:10px;font-weight:900;letter-spacing:1.5px;padding:14px 12px 6px}.nav button{display:block;width:100%;border:0;background:none;color:#c4c7cb;text-align:left;padding:10px 12px;border-radius:9px;margin:2px 0;font-weight:700}.nav button.active{background:var(--yellow);color:#111}.nav button:hover:not(.active){background:#f4d4000c;color:#fff}.main{min-width:0}.top{height:72px;display:flex;justify-content:flex-end;align-items:center;gap:9px;padding:0 24px;background:#111316e8;border-bottom:1px solid #fff1;position:sticky;top:0;z-index:5}.chip{border:1px solid #fff2;padding:7px 10px;border-radius:99px;color:#bbb;font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:#111;font-weight:900}.content{padding:28px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:18px}.eyebrow{color:var(--red);font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.head h1{font:700 34px Georgia;margin:5px 0}.head p{margin:0;color:var(--muted)}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr)}.three{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1.35fr 1fr}.card{background:#15171ad9;border:1px solid #fff1;border-radius:15px;padding:17px;box-shadow:0 12px 38px #0003;backdrop-filter:blur(15px)}.stat span,.muted{color:var(--muted)}.stat b{display:block;color:var(--yellow);font:700 29px Georgia;margin:5px 0}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{color:#858a91;font-size:10px;text-transform:uppercase;letter-spacing:1px;text-align:left;padding:11px 9px}.table td{border-top:1px solid #fff1;padding:11px 9px}.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:8px;padding:9px 12px;font-weight:800}.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#111}.btn.danger{color:var(--red)}.toolbar{display:flex;gap:8px;margin-bottom:12px}.input{width:100%;background:#0d0f11;border:1px solid #3a3e44;color:#fff;border-radius:8px;padding:10px;outline:0}.input:focus{border-color:var(--yellow)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;color:#8b9096;font-size:10px;font-weight:900;letter-spacing:1px;margin-bottom:5px}.full{grid-column:1/-1}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:900}.ok{color:var(--green);background:#52d62f16}.warn{color:var(--yellow);background:#f4d40016}.bad{color:var(--red);background:#f1263816}.modal-bg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:30}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#15171af8;border:1px solid #f4d4002a;border-radius:16px;padding:19px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{font:700 23px Georgia;margin:0}.close{background:none;border:0;color:#aaa;font-size:25px}.toast{position:fixed;right:18px;bottom:18px;background:var(--yellow);color:#111;padding:11px 15px;border-radius:9px;font-weight:900;z-index:50}.mobile{display:none}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 75% 15%,#f4d40018,transparent 28%),var(--bg)}.login-card{width:min(470px,100%);background:#15171af5;border:1px solid #f4d40025;border-radius:20px;padding:28px;box-shadow:0 25px 80px #0008}.login-card h1{font:700 38px Georgia;color:var(--yellow);margin:0}.login-card h2{color:var(--red);font-size:12px;letter-spacing:2px;margin:4px 0 20px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:#111316f2;border-top:1px solid #fff2;justify-content:space-around;padding:6px}.mobile button{border:0;background:none;color:#999;font-size:10px;padding:7px;font-weight:800}.mobile button.active{color:var(--yellow)}.content{padding:20px 13px 80px}.stats,.three,.two{grid-template-columns:1fr 1fr}.top{padding:0 13px}.formgrid{grid-template-columns:1fr}}
@media(max-width:560px){.stats,.three{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.head h1{font-size:28px}}
</style>

</head>
<body>
<div id="root"></div><div id="modal" class="modal-bg hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const URL='https://uejamozchnvrzkipchgu.supabase.co',KEY='sb_publishable_5S3QLjruTKgPU-Eehry5ig_O1pPEpdG',S=supabase.createClient(URL,KEY);
let C={user:null,org:null,role:null,branchId:null,branches:[],members:[],plans:[],memberships:[],payments:[],attendance:[],staff:[],pt:[],expenses:[],logs:[]},page='dashboard',rt=null;
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), money=x=>'₹'+Number(x||0).toLocaleString('en-IN'), today=()=>new Date().toISOString().slice(0,10);
const isOwner=()=>C.role==='owner',canManage=()=>C.role==='owner'||C.role==='manager', bname=id=>C.branches.find(x=>x.id===id)?.name||'Unassigned';
function toast(x){$('toast').textContent=x;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function modal(title,body,actions){$('modal').innerHTML='<div class="modal"><div class="modal-head"><h2>'+title+'</h2><button class="close" onclick="closeModal()">×</button></div>'+body+'<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button class="btn" onclick="closeModal()">Cancel</button>'+(actions||'')+'</div></div>';$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
function head(k,t,p,a=''){return '<div class="head"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+p+'</p></div>'+a+'</div>'}
function stat(a,b,c){return '<div class="card stat"><span>'+a+'</span><b>'+b+'</b><small class="muted">'+c+'</small></div>'}
function scope(a){return isOwner()?a:a.filter(x=>x.branch_id===C.branchId)}
async function q(table,order='created_at'){let x=S.from(table).select('*').eq('organization_id',C.org.id);if(order)x=x.order(order,{ascending:false});let r=await x;if(r.error)throw r.error;return r.data||[]}
async function load(){const z=await Promise.all([S.from('organizations').select('*').eq('id',C.org.id).single(),q('branches'),q('members'),q('membership_plans'),q('memberships','start_date'),q('payments','payment_date'),q('attendance','check_in'),q('organization_members'),q('pt_sessions','scheduled_at'),q('expenses','expense_date'),q('audit_logs')]);for(const r of z)if(r.error)throw r.error;[C.org,C.branches,C.members,C.plans,C.memberships,C.payments,C.attendance,C.staff,C.pt,C.expenses,C.logs]=z.map(r=>r.data)}
function memship(id){return C.memberships.filter(x=>x.member_id===id).sort((a,b)=>String(b.start_date).localeCompare(String(a.start_date)))[0]}
function plan(id){let m=memship(id);return C.plans.find(x=>x.id===m?.plan_id)?.name||'No plan'}
function statuss(id){let m=memship(id);if(!m)return ['No plan','warn'];let d=Math.ceil((new Date(m.end_date)-new Date())/86400000);return d<0?['Expired','bad']:d<=30?['Expiring soon','warn']:['Active','ok']}
function nav(){let a=['dashboard','members','attendance','memberships','payments','staff','pt','expenses','branches','reports'];return a.map(p=>'<button class="'+(page===p?'active':'')+'" onclick="go(\''+p+'\')">'+({'dashboard':'Dashboard','members':'Members','attendance':'Attendance','memberships':'Memberships','payments':'Payments','staff':'Trainers & Staff','pt':'Personal Training','expenses':'Expenses','branches':'Branches','reports':'Reports'}[p])+'</button>').join('')}
function shell(body){return '<div class="layout"><aside class="side"><div class="brand"><b>OldSkool</b><small>FITNESS STUDIO</small></div><div class="nav-title">OPERATIONS</div><nav class="nav">'+nav()+'</nav><div class="nav-title">ACCOUNT</div><nav class="nav"><button onclick="logout()">Logout</button></nav></aside><main class="main"><header class="top"><span class="chip">'+esc(C.org.name)+'</span><span class="chip">'+esc(C.role)+'</span><div class="avatar">'+esc((C.user.email||'?')[0].toUpperCase())+'</div></header><section class="content">'+body+'</section></main><div class="mobile">'+nav()+'</div></div>'}
async function go(p){page=p;render()}
async function render(){if(!C.user)return auth();let b='';if(page==='dashboard')b=dashboard();if(page==='members')b=members();if(page==='attendance')b=attendance();if(page==='memberships')b=memberships();if(page==='payments')b=payments();if(page==='staff')b=staff();if(page==='pt')b=pt();if(page==='expenses')b=expenses();if(page==='branches')b=branches();if(page==='reports')b=reports();$('root').innerHTML=shell(b)}
function dashboard(){let m=scope(C.members),a=scope(C.attendance),p=scope(C.payments),active=m.filter(x=>statuss(x.id)[0]!=='Expired').length,t=a.filter(x=>x.check_in.slice(0,10)===today()).length,r=p.filter(x=>x.status==='paid').reduce((s,x)=>s+Number(x.amount),0);return head('Overview','Dashboard','Live Old Skool operational data',canManage()?'<button class="btn primary" onclick="memberForm()">+ Add member</button>':'')+'<div class="grid stats">'+stat('Active members',active,'Live memberships')+stat("Today\'s check-ins",t,'Attendance')+stat('Revenue',money(r),'Recorded payments')+stat('Branches',C.branches.length,'Organization')+'</div><div class="grid two" style="margin-top:14px"><div class="card"><h3>Recent activity</h3>'+((C.logs||[]).slice(0,8).map(x=>'<div style="padding:9px 0;border-top:1px solid #fff1"><b>'+esc(x.action)+'</b> <span class="muted">'+esc(x.entity_type)+'</span><div class="muted">'+new Date(x.created_at).toLocaleString('en-IN')+'</div></div>').join('')||'<div class="muted">No activity yet.</div>')+'</div><div class="card"><h3>Membership pipeline</h3>'+['Active','Expiring soon','Expired'].map(s=>{let n=m.filter(x=>statuss(x.id)[0]===s).length;return '<p>'+s+' <b style="float:right">'+n+'</b></p><div style="height:7px;background:#292c31;border-radius:9px"><i style="display:block;height:100%;width:'+(m.length?n/m.length*100:0)+'%;background:var(--yellow)"></i></div>'}).join('')+'</div></div>'}
function members(){let a=scope(C.members);return head('Members','Members','All records are stored in Supabase',canManage()?'<button class="btn primary" onclick="memberForm()">+ Add member</button>':'')+'<div class="card"><div class="toolbar"><input class="input" id="search" placeholder="Search name or phone" oninput="filterMembers()"></div><div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Branch</th><th>Plan</th><th>Joined</th><th>Expiry</th><th>Status</th><th></th></tr></thead><tbody id="memberRows">'+memberRows(a)+'</tbody></table></div></div>'}
function memberRows(a){return a.map(m=>{let x=memship(m.id),s=statuss(m.id);return '<tr><td><b>'+esc(m.name)+'</b><div class="muted">'+esc(m.phone||'')+'</div></td><td>'+esc(bname(m.branch_id))+'</td><td>'+esc(plan(m.id))+'</td><td>'+esc(m.joining_date)+'</td><td>'+esc(x?.end_date||'—')+'</td><td><span class="badge '+s[1]+'">'+s[0]+'</span></td><td><button class="btn" onclick="memberForm(\''+m.id+'\')">Edit</button></td></tr>'}).join('')||'<tr><td colspan="7"><div class="muted">No members yet.</div></td></tr>'}
function filterMembers(){let q=($('search').value||'').toLowerCase();$('memberRows').innerHTML=memberRows(scope(C.members).filter(x=>(x.name+' '+(x.phone||'')).toLowerCase().includes(q)))}
function memberForm(id){let m=C.members.find(x=>x.id===id)||{},x=memship(id),p=C.plans.find(x=>x.id===m?.plan_id)||{};modal(id?'Edit member':'Add member','<div class="formgrid"><div class="field"><label>NAME</label><input class="input" id="mn" value="'+esc(m.name||'')+'"></div><div class="field"><label>PHONE</label><input class="input" id="mp" value="'+esc(m.phone||'')+'"></div><div class="field"><label>BRANCH</label><select class="input" id="mb">'+C.branches.filter(b=>isOwner()||b.id===C.branchId).map(b=>'<option value="'+b.id+'" '+(b.id===(m.branch_id||C.branchId)?'selected':'')+'>'+esc(b.name)+'</option>').join('')+'</select></div><div class="field"><label>JOIN DATE</label><input class="input" type="date" id="mj" value="'+(m.joining_date||today())+'"></div><div class="field"><label>PLAN</label><input class="input" id="pl" value="'+esc(p.name||'')+'"></div><div class="field"><label>AMOUNT</label><input class="input" type="number" id="amt" value="'+(x?.amount||'')+'"></div><div class="field"><label>EXPIRY</label><input class="input" type="date" id="end" value="'+(x?.end_date||'')+'"></div><div class="field"><label>HEIGHT CM</label><input class="input" type="number" id="ht" value="'+(m.height_cm||'')+'"></div><div class="field"><label>START WEIGHT KG</label><input class="input" type="number" id="sw" value="'+(m.starting_weight_kg||'')+'"></div><div class="field"><label>CURRENT WEIGHT KG</label><input class="input" type="number" id="cw" value="'+(m.current_weight_kg||'')+'"></div></div>','<button class="btn primary" onclick="saveMember(\''+id+'\')">Save</button>')}
async function saveMember(id){let branch_id=$('mb').value,name=$('mn').value.trim();if(!name)return toast('Name required');let d={organization_id:C.org.id,branch_id,name,phone:$('mp').value.trim(),joining_date:$('mj').value,height_cm:+$('ht').value||null,starting_weight_kg:+$('sw').value||null,current_weight_kg:+$('cw').value||null};let r=id?await S.from('members').update(d).eq('id',id):await S.from('members').insert({...d,member_no:'OS-'+Date.now().toString().slice(-7)}).select().single();if(r.error)return toast(r.error.message);let mid=id||r.data.id,pl=$('pl').value.trim(),end=$('end').value,amount=+$('amt').value||0;if(pl&&end){let p=C.plans.find(x=>x.name.toLowerCase()===pl.toLowerCase());if(!p){let z=await S.from('membership_plans').insert({organization_id:C.org.id,name:pl,duration_days:30,price:amount}).select().single();if(z.error)return toast(z.error.message);p=z.data}let old=memship(mid),mp={organization_id:C.org.id,branch_id,member_id:mid,plan_id:p.id,start_date:d.joining_date,end_date:end,amount,status:'active',created_by:C.user.id};r=old?await S.from('memberships').update(mp).eq('id',old.id):await S.from('memberships').insert(mp);if(r.error)return toast(r.error.message)}await load();closeModal();toast('Member saved');render()}
function attendance(){let a=scope(C.attendance);return head('Attendance','Attendance','Live check-ins and check-outs',canManage()?'<button class="btn primary" onclick="checkinForm()">+ Check in</button>':'')+'<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Member</th><th>Branch</th><th>In</th><th>Out</th><th></th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+x.check_in.slice(0,10)+'</td><td>'+esc(C.members.find(m=>m.id===x.member_id)?.name||'Member')+'</td><td>'+esc(bname(x.branch_id))+'</td><td>'+new Date(x.check_in).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+'</td><td>'+(x.check_out?new Date(x.check_out).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'—')+'</td><td>'+(!x.check_out?'<button class="btn" onclick="checkout(\''+x.id+'\')">Check out</button>':'')+'</td></tr>').join('')||'<tr><td colspan="6"><div class="muted">No attendance yet.</div></td></tr>'+'</tbody></table></div></div>'}
function checkinForm(){let m=scope(C.members).filter(x=>statuss(x.id)[0]!=='Expired');modal('Check in member','<div class="field"><label>MEMBER</label><select class="input" id="ci">'+m.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div>','<button class="btn primary" onclick="checkin()">Check in</button>')}
async function checkin(){let m=C.members.find(x=>x.id==$('ci').value);let r=await S.from('attendance').insert({organization_id:C.org.id,branch_id:m.branch_id,member_id:m.id,recorded_by:C.user.id});if(r.error)return toast(r.error.message);await load();closeModal();render()}
async function checkout(id){let r=await S.from('attendance').update({check_out:new Date().toISOString()}).eq('id',id);if(r.error)return toast(r.error.message);await load();render()}
function memberships(){let m=scope(C.members);return head('Memberships','Memberships','Subscription lifecycle')+'<div class="grid three">'+stat('Active',m.filter(x=>statuss(x.id)[0]==='Active').length,'Current')+stat('Expiring',m.filter(x=>statuss(x.id)[0]==='Expiring soon').length,'Within 30 days')+stat('Expired',m.filter(x=>statuss(x.id)[0]==='Expired').length,'Renewal needed')+'</div><div class="card" style="margin-top:14px"><div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Plan</th><th>Start</th><th>End</th><th>Amount</th><th>Status</th></tr></thead><tbody>'+m.map(x=>{let y=memship(x.id),s=statuss(x.id);return '<tr><td>'+esc(x.name)+'</td><td>'+esc(plan(x.id))+'</td><td>'+esc(y?.start_date||'')+'</td><td>'+esc(y?.end_date||'')+'</td><td>'+money(y?.amount)+'</td><td><span class="badge '+s[1]+'">'+s[0]+'</span></td></tr>'}).join('')+'</tbody></table></div></div>'}
function payments(){let a=scope(C.payments);return head('Finance','Payments','Live payment ledger',canManage()?'<button class="btn primary" onclick="paymentForm()">+ Record payment</button>':'')+'<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Member</th><th>Branch</th><th>Method</th><th>Amount</th><th>Status</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+x.payment_date.slice(0,10)+'</td><td>'+esc(C.members.find(m=>m.id===x.member_id)?.name||'Member')+'</td><td>'+esc(bname(x.branch_id))+'</td><td>'+esc(x.method)+'</td><td><b>'+money(x.amount)+'</b></td><td>'+esc(x.status)+'</td></tr>').join('')||'<tr><td colspan="6"><div class="muted">No payments yet.</div></td></tr>'+'</tbody></table></div></div>'}
function paymentForm(){modal('Record payment','<div class="formgrid"><div class="field full"><label>MEMBER</label><select class="input" id="pm">'+scope(C.members).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div><div class="field"><label>AMOUNT</label><input class="input" type="number" id="pa"></div><div class="field"><label>METHOD</label><select class="input" id="px"><option value="upi">UPI</option><option value="cash">Cash</option><option value="card">Card</option><option value="bank_transfer">Bank transfer</option></select></div></div>','<button class="btn primary" onclick="savePayment()">Save</button>')}
async function savePayment(){let m=C.members.find(x=>x.id==$('pm').value),a=+$('pa').value;if(!m||!a)return toast('Member and amount required');let r=await S.from('payments').insert({organization_id:C.org.id,branch_id:m.branch_id,member_id:m.id,amount:a,method:$('px').value,status:'paid',recorded_by:C.user.id});if(r.error)return toast(r.error.message);await load();closeModal();render()}
function staff(){let a=C.staff.filter(x=>x.role!=='owner');return head('People','Trainers & Staff','Role and branch assignment',isOwner()?'<button class="btn primary" onclick="staffForm()">+ Add staff</button>':'')+'<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>User</th><th>Role</th><th>Branch</th><th>Status</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.user_id)+'</td><td>'+esc(x.role)+'</td><td>'+esc(bname(x.branch_id))+'</td><td><span class="badge ok">'+esc(x.status)+'</span></td></tr>').join('')||'<tr><td colspan="4"><div class="muted">No staff yet.</div></td></tr>'+'</tbody></table></div></div>'}
function staffForm(){modal('Create staff account','<div class="formgrid"><div class="field"><label>FULL NAME</label><input class="input" id="sn"></div><div class="field"><label>EMAIL</label><input class="input" id="se" type="email"></div><div class="field"><label>TEMPORARY PASSWORD</label><input class="input" id="sp" type="password"></div><div class="field"><label>ROLE</label><select class="input" id="sr"><option value="trainer">Trainer</option><option value="manager">Manager</option></select></div><div class="field"><label>BRANCH</label><select class="input" id="sb">'+C.branches.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div><div class="field"><label>PHONE</label><input class="input" id="sph"></div><div class="field full"><label>SPECIALTY</label><input class="input" id="ss"></div></div>','<button class="btn primary" onclick="createStaff()">Create</button>')}
async function createStaff(){let body={organization_id:C.org.id,email:$('se').value.trim().toLowerCase(),password:$('sp').value,full_name:$('sn').value.trim(),phone:$('sph').value.trim(),role:$('sr').value,branch_id:$('sb').value,specialty:$('ss').value.trim(),joining_date:today()};if(!body.email||body.password.length<6||!body.full_name)return toast('Name, email and 6+ character password required');let r=await S.functions.invoke('create-staff-user',{body});if(r.error)return toast(r.error.message||'Unable to create staff');if(r.data?.error)return toast(r.data.error);await load();closeModal();toast('Staff account created');render()}
function pt(){let a=scope(C.pt);return head('Training','Personal Training','Live PT sessions',canManage()?'<button class="btn primary" onclick="ptForm()">+ Add session</button>':'')+'<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Member</th><th>Trainer</th><th>Status</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+x.scheduled_at.slice(0,10)+'</td><td>'+esc(C.members.find(m=>m.id===x.member_id)?.name||'Member')+'</td><td>'+esc(x.trainer_user_id)+'</td><td>'+esc(x.status)+'</td></tr>').join('')||'<tr><td colspan="4"><div class="muted">No PT sessions.</div></td></tr>'+'</tbody></table></div></div>'}
function ptForm(){let m=scope(C.members),t=C.staff.filter(x=>x.role==='trainer'&&(isOwner()||x.branch_id===C.branchId));modal('Add PT session','<div class="formgrid"><div class="field"><label>MEMBER</label><select class="input" id="tm">'+m.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div><div class="field"><label>TRAINER</label><select class="input" id="tt">'+t.map(x=>'<option value="'+x.user_id+'">'+esc(x.user_id)+'</option>').join('')+'</select></div><div class="field"><label>DATE</label><input class="input" type="date" id="td" value="'+today()+'"></div></div>','<button class="btn primary" onclick="savePT()">Save</button>')}
async function savePT(){let m=C.members.find(x=>x.id==$('tm').value),t=$('tt').value;if(!m||!t)return toast('Member and trainer required');let r=await S.from('pt_sessions').insert({organization_id:C.org.id,branch_id:m.branch_id,member_id:m.id,trainer_user_id:t,scheduled_at:$('td').value+'T09:00:00',status:'scheduled',created_by:C.user.id});if(r.error)return toast(r.error.message);await load();closeModal();render()}
function expenses(){if(!isOwner())return '<div class="muted">Owner access required.</div>';return head('Finance','Expenses','Operating expenses','<button class="btn primary" onclick="expenseForm()">+ Add expense</button>')+'<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Branch</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead><tbody>'+C.expenses.map(x=>'<tr><td>'+x.expense_date+'</td><td>'+esc(bname(x.branch_id))+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.description)+'</td><td>'+money(x.amount)+'</td></tr>').join('')||'<tr><td colspan="5"><div class="muted">No expenses.</div></td></tr>'+'</tbody></table></div></div>'}
function expenseForm(){modal('Add expense','<div class="formgrid"><div class="field"><label>BRANCH</label><select class="input" id="eb">'+C.branches.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div><div class="field"><label>DATE</label><input class="input" type="date" id="ed" value="'+today()+'"></div><div class="field"><label>CATEGORY</label><input class="input" id="ec"></div><div class="field"><label>AMOUNT</label><input class="input" type="number" id="ea"></div><div class="field full"><label>DESCRIPTION</label><input class="input" id="ex"></div></div>','<button class="btn primary" onclick="saveExpense()">Save</button>')}
async function saveExpense(){let a=+$('ea').value;if(!a)return toast('Amount required');let r=await S.from('expenses').insert({organization_id:C.org.id,branch_id:$('eb').value,expense_date:$('ed').value,category:$('ec').value,description:$('ex').value,amount:a,recorded_by:C.user.id});if(r.error)return toast(r.error.message);await load();closeModal();render()}
function branches(){if(!isOwner())return '<div class="muted">Owner access required.</div>';return head('Business','Branches','Organization branches','<button class="btn primary" onclick="branchForm()">+ Add branch</button>')+'<div class="grid three">'+C.branches.map(x=>'<div class="card"><h3>'+esc(x.name)+'</h3><p class="muted">'+esc(x.address||'No address')+'</p><span class="badge '+(x.status==='active'?'ok':'bad')+'">'+esc(x.status)+'</span></div>').join('')+'</div>'}
function branchForm(){modal('Add branch','<div class="formgrid"><div class="field"><label>NAME</label><input class="input" id="bn"></div><div class="field"><label>CODE</label><input class="input" id="bc"></div><div class="field full"><label>ADDRESS</label><input class="input" id="ba"></div></div>','<button class="btn primary" onclick="saveBranch()">Save</button>')}
async function saveBranch(){let n=$('bn').value.trim();if(!n)return toast('Name required');let r=await S.from('branches').insert({organization_id:C.org.id,name:n,code:$('bc').value.trim()||'BR-'+Date.now().toString().slice(-5),address:$('ba').value.trim(),status:'active'});if(r.error)return toast(r.error.message);await load();closeModal();render()}
function reports(){let m=scope(C.members),a=scope(C.attendance),p=scope(C.payments);return head('Analytics','Reports','Live metrics')+'<div class="grid stats">'+stat('Members',m.length,'Visible')+stat('Visits',a.length,'Attendance')+stat('Revenue',money(p.reduce((s,x)=>s+Number(x.amount),0)),'Payments')+stat('Expenses',money(C.expenses.reduce((s,x)=>s+Number(x.amount),0)),'Owner view')+'</div>'}
function auth(){ $('root').innerHTML='<div class="login"><div class="login-card"><div class="eyebrow">OLD SKOOL</div><h1>Fitness Studio</h1><h2>GYM MANAGEMENT SYSTEM</h2><p class="muted">Create the first Owner account or sign in to an existing Old Skool workspace.</p><div class="field"><label>GYM / COMPANY NAME — OWNER SETUP</label><input class="input" id="org" placeholder="Old Skool Fitness Studio"></div><div class="field"><label>OWNER NAME</label><input class="input" id="name" placeholder="Full name"></div><div class="field"><label>EMAIL</label><input class="input" id="email" type="email"></div><div class="field"><label>PASSWORD</label><input class="input" id="pass" type="password"></div><div style="display:flex;gap:8px;margin-top:15px"><button class="btn primary" onclick="signup()">Create Owner</button><button class="btn" onclick="signin()">Sign in</button></div><p class="muted" style="font-size:11px">Authentication is handled by Supabase Auth. No passwords are stored in the app database.</p></div></div>'}
async function signup(){let org=$('org').value.trim(),name=$('name').value.trim(),email=$('email').value.trim().toLowerCase(),password=$('pass').value;if(!org||!name||!email||password.length<6)return toast('Complete all fields; password must be 6+ characters');let r=await S.auth.signUp({email,password,options:{data:{full_name:name,org_name:org}}});if(r.error)return toast(r.error.message);if(!r.data.session)return toast('Account created. Confirm your email, then sign in.');await boot(r.data.user)}
async function signin(){let r=await S.auth.signInWithPassword({email:$('email').value.trim().toLowerCase(),password:$('pass').value});if(r.error)return toast(r.error.message);await boot(r.data.user)}
async function boot(user){let q=await S.from('organization_members').select('*').eq('user_id',user.id).eq('status','active').order('created_at').limit(1).maybeSingle();if(q.error)return toast(q.error.message);let mem=q.data;if(!mem&&user.user_metadata?.org_name){let slug=user.user_metadata.org_name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,55)+'-'+user.id.slice(0,7);let o=await S.from('organizations').insert({name:user.user_metadata.org_name,slug,created_by:user.id}).select().single();if(o.error)return toast(o.error.message);let mm=await S.from('organization_members').insert({organization_id:o.data.id,user_id:user.id,role:'owner',status:'active'}).select().single();if(mm.error)return toast(mm.error.message);mem=mm.data}if(!mem)return toast('No Old Skool workspace is assigned to this account.');C.user=user;C.org={id:mem.organization_id};C.role=mem.role;C.branchId=mem.branch_id;await load();render();subscribe()}
function subscribe(){if(rt)S.removeChannel(rt);rt=S.channel('oldskool-live').on('postgres_changes',{event:'*',schema:'public'},async()=>{if(C.user){try{await load();render()}catch(e){console.error(e)}}}).subscribe()}
async function logout(){await S.auth.signOut();C={user:null,org:null,role:null,branchId:null,branches:[],members:[],plans:[],memberships:[],payments:[],attendance:[],staff:[],pt:[],expenses:[],logs:[]};auth()}
S.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT')auth()});
(async()=>{let s=await S.auth.getSession();if(s.data.session)await boot(s.data.session.user);else auth()})();
</script>
</body>
</html>
