<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OldSkool — Fitness Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b0c0e;--panel:#15171a;--panel2:#1c1f23;--line:#30343a;--text:#f4f4f1;--muted:#969aa1;--yellow:#f4d400;--red:#f12638;--green:#52d62f;--shadow:0 22px 70px #0008}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#f4d4000c,transparent 28%),radial-gradient(circle at 100% 100%,#f1263808,transparent 25%),var(--bg);color:var(--text);font-family:Figtree,system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid #fff1;background:#101215ee;backdrop-filter:blur(20px);padding:24px 14px;position:sticky;top:0;height:100vh}.brand{padding:4px 12px 25px}.brand b{font:800 32px Fraunces;color:var(--yellow);letter-spacing:-1.5px}.brand span{display:block;color:var(--red);font-size:11px;font-weight:900;letter-spacing:2px;margin-top:2px}.nav-label{font-size:10px;color:#70747a;font-weight:800;letter-spacing:1.5px;padding:16px 12px 7px}.nav button{width:100%;border:0;background:transparent;color:#bfc2c7;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0;font-weight:700}.nav button:hover{background:#f4d4000d;color:#fff}.nav button.active{background:var(--yellow);color:#111}.main{min-width:0}.top{height:76px;border-bottom:1px solid #fff1;background:#101215d9;backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:flex-end;padding:0 28px;gap:12px;position:sticky;top:0;z-index:5}.chip{padding:8px 11px;border:1px solid #fff2;border-radius:999px;color:#bbb;font-size:12px}.user{display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--yellow);color:#111;display:grid;place-items:center;font-weight:900}.content{padding:28px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:20px}.eyebrow{color:var(--red);font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.head h1{font:700 34px Fraunces;margin:5px 0}.head p{margin:0;color:var(--muted)}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.4fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:#15171acc;border:1px solid #fff1;border-radius:16px;padding:18px;box-shadow:0 12px 40px #0003;backdrop-filter:blur(16px)}.stat b{display:block;font:700 30px Fraunces;color:var(--yellow);margin:4px 0}.stat span{color:var(--muted);font-size:12px}.stat small{color:#777}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#858a91;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:12px 10px}.table td{padding:12px 10px;border-top:1px solid #fff1;font-size:13px}.table tr:hover td{background:#f4d40006}.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:9px;padding:9px 13px;font-weight:800}.btn.primary{background:var(--yellow);color:#111;border-color:var(--yellow)}.btn.danger{color:var(--red)}.btn:disabled{opacity:.5}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1;min-width:180px}.input{width:100%;background:#0d0f11;color:#fff;border:1px solid #383c42;border-radius:9px;padding:10px 11px;outline:0}.input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px #f4d40018}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:#888d94;font-size:10px;font-weight:800;letter-spacing:1px;margin-bottom:5px}.field.full{grid-column:1/-1}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900}.active{color:var(--green);background:#52d62f16}.warn{color:var(--yellow);background:#f4d40016}.expired{color:var(--red);background:#f1263816}.muted{color:var(--muted)}.bar{height:7px;background:#292c31;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--yellow)}.empty{padding:28px;text-align:center;color:#73777d}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 75% 20%,#f4d40014,transparent 28%),var(--bg)}.loginbox{width:min(470px,100%);background:#15171af2;border:1px solid #f4d40024;border-radius:22px;padding:28px;box-shadow:var(--shadow);backdrop-filter:blur(20px)}.loginbox h1{font:700 38px Fraunces;margin:0;color:var(--yellow)}.loginbox h2{font-size:13px;color:var(--red);letter-spacing:2px;margin:2px 0 20px}.modalback{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#15171af7;border:1px solid #f4d4002b;border-radius:18px;padding:20px;box-shadow:var(--shadow)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{font:700 24px Fraunces;margin:0}.close{background:transparent;border:0;color:#aaa;font-size:25px}.toast{position:fixed;right:20px;bottom:20px;background:#f4d400;color:#111;padding:11px 15px;border-radius:10px;font-weight:900;z-index:50}.mobile{display:none}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:#101215ee;border-top:1px solid #fff2;padding:7px;justify-content:space-around;backdrop-filter:blur(18px)}.mobile button{border:0;background:none;color:#999;font-size:10px;font-weight:800;padding:7px}.mobile button.active{color:var(--yellow)}.content{padding:20px 14px 90px}.stats,.three,.two{grid-template-columns:1fr 1fr}.head h1{font-size:28px}.top{padding:0 14px}.formgrid{grid-template-columns:1fr}}
@media(max-width:560px){.stats,.three{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" class="modalback hidden"></div>
<div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL='https://uejamozchnvrzkipchgu.supabase.co';
const SUPABASE_KEY='sb_publishable_5S3QLjruTKgPU-Eehry5ig_O1pPEpdG';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let ctx={user:null,org:null,member:null,branches:[],members:[],plans:[],memberships:[],payments:[],attendance:[],staff:[],pt:[],expenses:[],notifications:[],logs:[]};
let page='dashboard',channel=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const initials=n=>String(n||'').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
const branchName=id=>ctx.branches.find(b=>b.id===id)?.name||'Unassigned';
const roleName=r=>({owner:'Owner',manager:'Manager',trainer:'Trainer'})[r]||r;
const canManage=()=>['owner','manager'].includes(ctx.member?.role);
const isOwner=()=>ctx.member?.role==='owner';
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2600)}
function modal(title,body,buttons=''){document.getElementById('modal').innerHTML='<div class="modal"><div class="modalhead"><h2>'+title+'</h2><button class="close" onclick="closeModal()">×</button></div>'+body+'<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button class="btn" onclick="closeModal()">Cancel</button>'+buttons+'</div></div>';document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function nav(){return ['dashboard','members','attendance','memberships','payments','staff','pt','expenses','branches','reports'].map(p=>'<button class="'+(page===p?'active':'')+'" onclick="go(\''+p+'\')">'+p.replace('pt','Personal Training').replace('dashboard','Dashboard').replace('memberships','Memberships').replace('staff','Trainers & Staff').replace('pt','Personal Training').replace('expenses','Expenses').replace('branches','Branches').replace('reports','Reports').replace('members','Members').replace('attendance','Attendance').replace('payments','Payments')+'</button>').join('')}
function shell(content){return '<div class="shell"><aside class="side"><div class="brand"><b>OldSkool</b><span>FITNESS STUDIO</span></div><div class="nav-label">COMMAND CENTER</div><nav class="nav">'+nav()+'</nav><div class="nav-label">ACCOUNT</div><nav class="nav"><button onclick="logout()">Logout</button></nav></aside><main class="main"><header class="top"><span class="chip">'+esc(ctx.org?.name||'Old Skool')+'</span><span class="chip">'+esc(ctx.member?.role?roleName(ctx.member.role):'')+'</span><div class="user"><div class="avatar">'+initials(ctx.user?.email)+'</div><span>'+esc(ctx.user?.email||'')+'</span></div></header><section class="content">'+content+'</section></main><div class="mobile">'+nav()+'</div></div>'}
async function query(table,order='created_at'){let q=sb.from(table).select('*').eq('organization_id',ctx.member.organization_id);if(order)q=q.order(order,{ascending:false});const {data,error}=await q;if(error)throw error;return data||[]}
async function load(){
 const [org,branches,members,plans,mships,payments,att,staff,pt,expenses,notifications,logs]=await Promise.all([
  sb.from('organizations').select('*').eq('id',ctx.member.organization_id).single(),query('branches'),query('members'),query('membership_plans'),query('memberships','start_date'),query('payments','payment_date'),query('attendance','check_in'),query('organization_members'),query('pt_sessions','scheduled_at'),query('expenses','expense_date'),query('notifications'),query('audit_logs')
 ]);
 for(const x of [org,branches,members,plans,mships,payments,att,staff,pt,expenses,notifications,logs])if(x.error)throw x.error;
 ctx.org=org.data;ctx.branches=branches.data;ctx.members=members.data;ctx.plans=plans.data;ctx.memberships=mships.data;ctx.payments=payments.data;ctx.attendance=att.data;ctx.staff=staff.data;ctx.pt=pt.data;ctx.expenses=expenses.data;ctx.notifications=notifications.data;ctx.logs=logs.data;
}
function membershipFor(id){return ctx.memberships.filter(x=>x.member_id===id).sort((a,b)=>String(b.start_date).localeCompare(String(a.start_date)))[0]}
function memberPlan(id){const m=membershipFor(id);return ctx.plans.find(p=>p.id===m?.plan_id)?.name||'No plan'}
function status(m){const x=membershipFor(m.id);if(!x)return ['No plan','warn'];const d=Math.ceil((new Date(x.end_date)-new Date())/86400000);return d<0?['Expired','expired']:d<=30?['Expiring soon','warn']:['Active','active']}
function membersScoped(){return ctx.member.role==='owner'?ctx.members:ctx.members.filter(m=>m.branch_id===ctx.member.branch_id)}
function branchScoped(arr){return ctx.member.role==='owner'?arr:arr.filter(x=>x.branch_id===ctx.member.branch_id)}
function head(k,t,s,button=''){return '<div class="head"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+s+'</p></div><div>'+button+'</div></div>'}
function stat(label,value,sub){return '<div class="card stat"><span>'+label+'</span><b>'+value+'</b><small>'+sub+'</small></div>'}
async function go(p){page=p;render()}
async function render(){
 if(!ctx.user)return renderAuth();
 let body='';
 if(page==='dashboard')body=dashboard();else if(page==='members')body=membersPage();else if(page==='attendance')body=attendancePage();else if(page==='memberships')body=membershipPage();else if(page==='payments')body=paymentsPage();else if(page==='staff')body=staffPage();else if(page==='pt')body=ptPage();else if(page==='expenses')body=expensesPage();else if(page==='branches')body=branchesPage();else if(page==='reports')body=reportsPage();
 document.getElementById('root').innerHTML=shell(body)
}
function dashboard(){const ms=membersScoped(),att=branchScoped(ctx.attendance),pay=branchScoped(ctx.payments),active=ms.filter(m=>status(m)[0]!=='Expired').length,today=att.filter(x=>x.check_in.slice(0,10)===new Date().toISOString().slice(0,10)).length,revenue=pay.filter(x=>x.status==='paid').reduce((a,x)=>a+Number(x.amount),0);return head('Overview','Dashboard','Live operational data from Old Skool',isOwner()?'<button class="btn primary" onclick="memberForm()">+ Add member</button>':'')+'<div class="grid stats">'+stat('Active members',active,'Live memberships')+stat('Today\'s check-ins',today,'Attendance records')+stat('Revenue',money(revenue),'Recorded payments')+stat('Branches',ctx.branches.length,'Organization branches')+'</div><div class="grid two" style="margin-top:14px"><div class="card"><h3>Recent activity</h3>'+((ctx.logs||[]).slice(0,8).map(x=>'<div style="padding:10px 0;border-top:1px solid #fff1"><b>'+esc(x.action)+'</b> <span class="muted">'+esc(x.entity_type)+'</span><div class="muted" style="font-size:11px">'+new Date(x.created_at).toLocaleString('en-IN')+'</div></div>').join('')||'<div class="empty">No activity yet.</div>')+'</div><div class="card"><h3>Membership pipeline</h3>'+['Active','Expiring soon','Expired'].map(s=>{const n=ms.filter(m=>status(m)[0]===s).length;return '<div style="padding:12px 0"><div style="display:flex;justify-content:space-between"><span>'+s+'</span><b>'+n+'</b></div><div class="bar"><i style="width:'+Math.min(100,ms.length?n/ms.length*100:0)+'%"></i></div></div>'}).join('')+'</div></div>'}
function membersPage(){const ms=membersScoped();return head('Members','Members','Every member record comes from PostgreSQL',canManage()?'<button class="btn primary" onclick="memberForm()">+ Add member</button>':'')+'<div class="card"><div class="toolbar"><input class="input" id="mq" placeholder="Search name or phone" oninput="filterMemberTable()"></div><div class="tablewrap"><table class="table"><thead><tr><th>Member</th><th>Branch</th><th>Plan</th><th>Joined</th><th>Expiry</th><th>Status</th><th></th></tr></thead><tbody id="memberRows">'+memberRows(ms)+'</tbody></table></div></div>'}
function memberRows(ms){return ms.map(m=>{const s=status(m),x=membershipFor(m.id);return '<tr><td><b>'+esc(m.name)+'</b><div class="muted">'+esc(m.phone||'')+'</div></td><td>'+esc(branchName(m.branch_id))+'</td><td>'+esc(memberPlan(m.id))+'</td><td>'+esc(m.joining_date)+'</td><td>'+esc(x?.end_date||'—')+'</td><td><span class="badge '+s[1]+'">'+s[0]+'</span></td><td><button class="btn" onclick="memberForm(\''+m.id+'\')">Edit</button></td></tr>'}).join('')||'<tr><td colspan="7"><div class="empty">No members yet.</div></td></tr>'}
function filterMemberTable(){const q=(document.getElementById('mq').value||'').toLowerCase();document.getElementById('memberRows').innerHTML=memberRows(membersScoped().filter(m=>(m.name+' '+(m.phone||'')).toLowerCase().includes(q)))}
function memberForm(id){const m=ctx.members.find(x=>x.id===id)||{},x=membershipFor(id),p=ctx.plans.find(p=>p.id===x?.plan_id)||{};modal(id?'Edit member':'Add member','<div class="formgrid"><div class="field"><label>NAME</label><input class="input" id="mn" value="'+esc(m.name||'')+'"></div><div class="field"><label>PHONE</label><input class="input" id="mp" value="'+esc(m.phone||'')+'"></div><div class="field"><label>BRANCH</label><select class="input" id="mb">'+ctx.branches.filter(b=>isOwner()||b.id===ctx.member.branch_id).map(b=>'<option value="'+b.id+'" '+(b.id===(m.branch_id||ctx.member.branch_id)?'selected':'')+'>'+esc(b.name)+'</option>').join('')+'</select></div><div class="field"><label>JOINING DATE</label><input class="input" type="date" id="mj" value="'+(m.joining_date||new Date().toISOString().slice(0,10))+'"></div><div class="field"><label>PLAN</label><input class="input" id="mpl" value="'+esc(p.name||'')+'" placeholder="Monthly"></div><div class="field"><label>AMOUNT</label><input class="input" type="number" id="ma" value="'+(x?.amount||'')+'"></div><div class="field"><label>EXPIRY</label><input class="input" type="date" id="me" value="'+(x?.end_date||'')+'"></div><div class="field"><label>HEIGHT (CM)</label><input class="input" type="number" id="mh" value="'+(m.height_cm||'')+'"></div><div class="field"><label>START WEIGHT (KG)</label><input class="input" type="number" id="msw" value="'+(m.starting_weight_kg||'')+'"></div><div class="field"><label>CURRENT WEIGHT (KG)</label><input class="input" type="number" id="mcw" value="'+(m.current_weight_kg||'')+'"></div></div>','<button class="btn primary" onclick="saveMember(\''+id+'\')">Save</button>')}
async function saveMember(id){const name=document.getElementById('mn').value.trim(),branch_id=document.getElementById('mb').value;if(!name)return toast('Name is required');const payload={organization_id:ctx.member.organization_id,branch_id,name,phone:document.getElementById('mp').value.trim(),joining_date:document.getElementById('mj').value,height_cm:Number(document.getElementById('mh').value)||null,starting_weight_kg:Number(document.getElementById('msw').value)||null,current_weight_kg:Number(document.getElementById('mcw').value)||null};let r;if(id)r=await sb.from('members').update(payload).eq('id',id);else{payload.member_no='OS-'+Date.now().toString().slice(-7);r=await sb.from('members').insert(payload)}if(r.error)return toast(r.error.message);const planName=document.getElementById('mpl').value.trim(),end=document.getElementById('me').value,amount=Number(document.getElementById('ma').value)||0;if(planName&&end){let pl=ctx.plans.find(p=>p.name.toLowerCase()===planName.toLowerCase());if(!pl){const pr=await sb.from('membership_plans').insert({organization_id:ctx.member.organization_id,name:planName,duration_days:30,price:amount}).select().single();if(pr.error)return toast(pr.error.message);pl=pr.data}let memberId=id;if(!memberId){const q=await sb.from('members').select('id').eq('organization_id',ctx.member.organization_id).eq('member_no',payload.member_no).single();memberId=q.data.id}const old=membershipFor(memberId);const mp={organization_id:ctx.member.organization_id,branch_id,member_id:memberId,plan_id:pl.id,start_date:payload.joining_date,end_date:end,amount,status:'active',created_by:ctx.user.id};const q=old?await sb.from('memberships').update(mp).eq('id',old.id):await sb.from('memberships').insert(mp);if(q.error)return toast(q.error.message)}await load();closeModal();toast(id?'Member updated':'Member created');render()}
function attendancePage(){const rows=branchScoped(ctx.attendance);return head('Attendance','Attendance','Live member check-in and check-out',canManage()?'<button class="btn primary" onclick="checkinForm()">+ Check in</button>':'')+'<div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Member</th><th>Branch</th><th>In</th><th>Out</th><th></th></tr></thead><tbody>'+rows.map(x=>{const m=ctx.members.find(m=>m.id===x.member_id);return '<tr><td>'+x.check_in.slice(0,10)+'</td><td>'+esc(m?.name||'Member')+'</td><td>'+esc(branchName(x.branch_id))+'</td><td>'+new Date(x.check_in).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+'</td><td>'+(x.check_out?new Date(x.check_out).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'—')+'</td><td>'+(!x.check_out?'<button class="btn" onclick="checkout(\''+x.id+'\')">Check out</button>':'')+'</td></tr>'}).join('')||'<tr><td colspan="6"><div class="empty">No attendance yet.</div></td></tr>'+'</tbody></table></div></div>'}
function checkinForm(){const ms=membersScoped().filter(m=>status(m)[0]!=='Expired');modal('Check in member','<div class="field"><label>MEMBER</label><select class="input" id="cm">'+ms.map(m=>'<option value="'+m.id+'">'+esc(m.name)+'</option>').join('')+'</select></div>','<button class="btn primary" onclick="checkin()">Check in</button>')}
async function checkin(){const id=document.getElementById('cm').value,m=ctx.members.find(x=>x.id===id);if(!m)return;const r=await sb.from('attendance').insert({organization_id:ctx.member.organization_id,branch_id:m.branch_id,member_id:id,recorded_by:ctx.user.id});if(r.error)return toast(r.error.message);await load();closeModal();toast('Checked in');render()}
async function checkout(id){const r=await sb.from('attendance').update({check_out:new Date().toISOString()}).eq('id',id);if(r.error)return toast(r.error.message);await load();render()}
function membershipPage(){const ms=membersScoped();return head('Memberships','Memberships','Subscription lifecycle from live records')+'<div class="grid three">'+stat('Active',ms.filter(m=>status(m)[0]==='Active').length,'Current')+stat('Expiring',ms.filter(m=>status(m)[0]==='Expiring soon').length,'30 days')+stat('Expired',ms.filter(m=>status(m)[0]==='Expired').length,'Requires renewal')+'</div><div class="card" style="margin-top:14px"><div class="tablewrap"><table class="table"><thead><tr><th>Member</th><th>Plan</th><th>Start</th><th>End</th><th>Amount</th><th>Status</th></tr></thead><tbody>'+ms.map(m=>{const x=membershipFor(m.id),s=status(m);return '<tr><td>'+esc(m.name)+'</td><td>'+esc(memberPlan(m.id))+'</td><td>'+esc(x?.start_date||'')+'</td><td>'+esc(x?.end_date||'')+'</td><td>'+money(x?.amount||0)+'</td><td><span class="badge '+s[1]+'">'+s[0]+'</span></td></tr>'}).join('')+'</tbody></table></div></div>'}
function paymentsPage(){const rows=branchScoped(ctx.payments);return head('Finance','Payments','Live payment ledger',canManage()?'<button class="btn primary" onclick="paymentForm()">+ Record payment</button>':'')+'<div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Member</th><th>Method</th><th>Amount</th><th>Status</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+x.payment_date.slice(0,10)+'</td><td>'+esc(ctx.members.find(m=>m.id===x.member_id)?.name||'Member')+'</td><td>'+esc(x.method)+'</td><td><b>'+money(x.amount)+'</b></td><td><span class="badge active">'+esc(x.status)+'</span></td></tr>').join('')||'<tr><td colspan="5"><div class="empty">No payments yet.</div></td></tr>'+'</tbody></table></div></div>'}
function paymentForm(){modal('Record payment','<div class="formgrid"><div class="field full"><label>MEMBER</label><select class="input" id="pm">'+membersScoped().map(m=>'<option value="'+m.id+'">'+esc(m.name)+'</option>').join('')+'</select></div><div class="field"><label>AMOUNT</label><input class="input" type="number" id="pa"></div><div class="field"><label>METHOD</label><select class="input" id="px"><option value="upi">UPI</option><option value="cash">Cash</option><option value="card">Card</option><option value="bank_transfer">Bank Transfer</option></select></div></div>','<button class="btn primary" onclick="savePayment()">Save</button>')}
async function savePayment(){const m=ctx.members.find(x=>x.id===document.getElementById('pm').value),amount=Number(document.getElementById('pa').value);if(!m||!amount)return toast('Member and amount required');const r=await sb.from('payments').insert({organization_id:ctx.member.organization_id,branch_id:m.branch_id,member_id:m.id,amount,method:document.getElementById('px').value,status:'paid',recorded_by:ctx.user.id});if(r.error)return toast(r.error.message);await load();closeModal();toast('Payment recorded');render()}
function staffPage(){const rows=ctx.staff.filter(x=>['trainer','manager'].includes(x.role));return head('People','Trainers & Staff','Organization staff records and branch assignments',isOwner()?'<button class="btn primary" onclick="staffForm()">+ Add staff</button>':'')+'<div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>User ID</th><th>Role</th><th>Branch</th><th>Status</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.user_id)+'</td><td>'+roleName(x.role)+'</td><td>'+esc(branchName(x.branch_id))+'</td><td><span class="badge active">'+esc(x.status)+'</span></td></tr>').join('')||'<tr><td colspan="4"><div class="empty">No staff records.</div></td></tr>'+'</tbody></table></div></div>'}
function staffForm(){modal('Create staff identity','<div class="field"><label>STAFF EMAIL</label><input class="input" id="se" type="email"><small class="muted">The account will be created through Supabase Auth. Staff creation is finalized in the next admin-invitation phase.</small></div>','<button class="btn primary" onclick="toast(\'Staff invitations will use the secure admin function in the next build.\')">Continue</button>')}
function ptPage(){const rows=branchScoped(ctx.pt);return head('Training','Personal Training','PT sessions stored in PostgreSQL',canManage()?'<button class="btn primary" onclick="ptForm()">+ Add session</button>':'')+'<div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Member</th><th>Trainer</th><th>Status</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+x.scheduled_at.slice(0,10)+'</td><td>'+esc(ctx.members.find(m=>m.id===x.member_id)?.name||'Member')+'</td><td>'+esc(x.trainer_user_id)+'</td><td>'+esc(x.status)+'</td></tr>').join('')||'<tr><td colspan="4"><div class="empty">No PT sessions.</div></td></tr>'+'</tbody></table></div></div>'}
function ptForm(){const ms=membersScoped();const ts=ctx.staff.filter(x=>x.role==='trainer'&&(isOwner()||x.branch_id===ctx.member.branch_id));modal('Add PT session','<div class="formgrid"><div class="field"><label>MEMBER</label><select class="input" id="tm">'+ms.map(m=>'<option value="'+m.id+'">'+esc(m.name)+'</option>').join('')+'</select></div><div class="field"><label>TRAINER USER ID</label><select class="input" id="tt">'+ts.map(t=>'<option value="'+t.user_id+'">'+esc(t.user_id)+'</option>').join('')+'</select></div><div class="field"><label>DATE</label><input class="input" type="date" id="td" value="'+new Date().toISOString().slice(0,10)+'"></div></div>','<button class="btn primary" onclick="savePT()">Save</button>')}
async function savePT(){const m=ctx.members.find(x=>x.id===document.getElementById('tm').value),t=document.getElementById('tt').value;if(!m||!t)return toast('Member and trainer required');const r=await sb.from('pt_sessions').insert({organization_id:ctx.member.organization_id,branch_id:m.branch_id,member_id:m.id,trainer_user_id:t,scheduled_at:document.getElementById('td').value+'T09:00:00',status:'scheduled',created_by:ctx.user.id});if(r.error)return toast(r.error.message);await load();closeModal();toast('PT session created');render()}
function expensesPage(){if(!isOwner())return '<div class="empty">Owner access required.</div>';const rows=ctx.expenses;return head('Finance','Expenses','Operating expenses by branch','<button class="btn primary" onclick="expenseForm()">+ Add expense</button>')+'<div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Branch</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+x.expense_date+'</td><td>'+esc(branchName(x.branch_id))+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.description)+'</td><td><b>'+money(x.amount)+'</b></td></tr>').join('')||'<tr><td colspan="5"><div class="empty">No expenses.</div></td></tr>'+'</tbody></table></div></div>'}
function expenseForm(){modal('Add expense','<div class="formgrid"><div class="field"><label>BRANCH</label><select class="input" id="eb">'+ctx.branches.map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join('')+'</select></div><div class="field"><label>DATE</label><input class="input" type="date" id="ed" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>CATEGORY</label><input class="input" id="ec"></div><div class="field"><label>AMOUNT</label><input class="input" type="number" id="ea"></div><div class="field full"><label>DESCRIPTION</label><input class="input" id="ex"></div></div>','<button class="btn primary" onclick="saveExpense()">Save</button>')}
async function saveExpense(){const amount=Number(document.getElementById('ea').value);const r=await sb.from('expenses').insert({organization_id:ctx.member.organization_id,branch_id:document.getElementById('eb').value,expense_date:document.getElementById('ed').value,category:document.getElementById('ec').value,description:document.getElementById('ex').value,amount,recorded_by:ctx.user.id});if(r.error)return toast(r.error.message);await load();closeModal();toast('Expense saved');render()}
function branchesPage(){if(!isOwner())return '<div class="empty">Owner access required.</div>';return head('Business','Branches','All branch records are live from Supabase','<button class="btn primary" onclick="branchForm()">+ Add branch</button>')+'<div class="grid three">'+ctx.branches.map(b=>'<div class="card"><h3>'+esc(b.name)+'</h3><p class="muted">'+esc(b.address||'No address')+'</p><span class="badge '+(b.status==='active'?'active':'expired')+'">'+esc(b.status)+'</span></div>').join('')+'</div>'}
function branchForm(){modal('Add branch','<div class="formgrid"><div class="field"><label>NAME</label><input class="input" id="bn"></div><div class="field"><label>CODE</label><input class="input" id="bc"></div><div class="field full"><label>ADDRESS</label><input class="input" id="ba"></div></div>','<button class="btn primary" onclick="saveBranch()">Save</button>')}
async function saveBranch(){const name=document.getElementById('bn').value.trim();if(!name)return toast('Name required');const r=await sb.from('branches').insert({organization_id:ctx.member.organization_id,name,code:document.getElementById('bc').value.trim()||'BR-'+Date.now().toString().slice(-5),address:document.getElementById('ba').value.trim(),status:'active'});if(r.error)return toast(r.error.message);await load();closeModal();toast('Branch created');render()}
function reportsPage(){const ms=membersScoped(),pay=branchScoped(ctx.payments),att=branchScoped(ctx.attendance);return head('Analytics','Reports','Live organization metrics')+'<div class="grid stats">'+stat('Members',ms.length,'Visible records')+stat('Visits',att.length,'Attendance records')+stat('Revenue',money(pay.reduce((a,x)=>a+Number(x.amount),0)),'Payments')+stat('Expenses',money(ctx.expenses.reduce((a,x)=>a+Number(x.amount),0)),'Owner view')+'</div>'}
async function logout(){await sb.auth.signOut();ctx={user:null,org:null,member:null,branches:[],members:[],plans:[],memberships:[],payments:[],attendance:[],staff:[],pt:[],expenses:[],notifications:[],logs:[]};renderAuth()}
function renderAuth(){document.getElementById('root').innerHTML='<div class="login"><div class="loginbox"><div class="eyebrow">OLD SKOOL</div><h1>Fitness Studio</h1><h2>GYM MANAGEMENT SYSTEM</h2><p class="muted">Create the first Owner account for your organization, or sign in to an existing workspace.</p><div class="field"><label>GYM / COMPANY NAME (OWNER SETUP)</label><input class="input" id="on" placeholder="Old Skool Fitness Studio"></div><div class="field"><label>OWNER NAME</label><input class="input" id="owner" placeholder="Full name"></div><div class="field"><label>EMAIL</label><input class="input" id="email" type="email"></div><div class="field"><label>PASSWORD</label><input class="input" id="pass" type="password"></div><div style="display:flex;gap:8px;margin-top:15px"><button class="btn primary" onclick="signup()">Create Owner</button><button class="btn" onclick="signin()">Sign in</button></div><p class="muted" style="font-size:11px;margin-top:14px">Passwords are handled by Supabase Auth. Old Skool does not store credentials.</p></div></div>'}
async function signup(){const org=document.getElementById('on').value.trim(),name=document.getElementById('owner').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('pass').value;if(!org||!name||!email||password.length<6)return toast('Complete all fields; password must be 6+ characters');const r=await sb.auth.signUp({email,password,options:{data:{full_name:name,org_name:org}}});if(r.error)return toast(r.error.message);if(!r.data.session)return toast('Account created. Confirm the email, then sign in.');await bootUser(r.data.user)}
async function signin(){const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('pass').value;const r=await sb.auth.signInWithPassword({email,password});if(r.error)return toast(r.error.message);await bootUser(r.data.user)}
async function bootUser(user){let q=await sb.from('organization_members').select('*').eq('user_id',user.id).eq('status','active').order('created_at').limit(1).maybeSingle();if(q.error)return toast(q.error.message);let mem=q.data;if(!mem&&user.user_metadata?.org_name){const slug=user.user_metadata.org_name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,60)+'-'+user.id.slice(0,6);let o=await sb.from('organizations').insert({name:user.user_metadata.org_name,slug,created_by:user.id}).select().single();if(o.error)return toast(o.error.message);let m=await sb.from('organization_members').insert({organization_id:o.data.id,user_id:user.id,role:'owner',status:'active'}).select().single();if(m.error)return toast(m.error.message);mem=m.data}if(!mem)return toast('No Old Skool workspace is assigned to this account.');ctx.user=user;ctx.member=mem;await load();render();subscribe()}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('oldskool-live').on('postgres_changes',{event:'*',schema:'public',table:'members'},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'payments'},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'attendance'},async()=>{await load();render()}).subscribe()}
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'){ctx.user=null;renderAuth()}});
(async()=>{const s=await sb.auth.getSession();if(s.data.session)await bootUser(s.data.session.user);else renderAuth()})();
</script>
</body>
</html>
